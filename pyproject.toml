[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-monitor"
version = "0.1.0"
description = "Autonomous ML model monitoring with agentic root cause diagnosis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mlops", "drift-detection", "model-monitoring", "llm", "autonomous-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
xgboost  = ["xgboost>=2.0"]
shap     = ["shap>=0.44"]
openai   = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
all      = ["xgboost>=2.0", "shap>=0.44", "openai>=1.0", "anthropic>=0.25"]

[project.urls]
Homepage   = "https://github.com/yourusername/aria-monitor"
Repository = "https://github.com/yourusername/aria-monitor"
Issues     = "https://github.com/yourusername/aria-monitor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aria*"]
